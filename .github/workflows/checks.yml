# Formatting, Clippy, the tests, the oldest supported Rust, and the desktop
# entry and AppStream metadata. Called by CI and Release.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    # Debian 13 has GTK 4.18 and libadwaita 1.7; Ubuntu 24.04's are too old
    container: debian:trixie
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes \
            ca-certificates curl gcc git libc6-dev pkg-config \
            libgtk-4-dev libadwaita-1-dev libmpv-dev appstream desktop-file-utils
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install the pinned toolchain and the oldest supported one
        run: |
          rustup toolchain install
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-features --locked
      - name: Build with the oldest supported Rust
        run: cargo "+$MSRV" check --locked
      - name: Validate the desktop entry and AppStream metadata
        run: |
          desktop-file-validate data/io.github.joaotroxo.Jelly.desktop
          appstreamcli validate --no-net --explain data/io.github.joaotroxo.Jelly.metainfo.xml
