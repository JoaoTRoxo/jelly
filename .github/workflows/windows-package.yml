# The Windows zip, built with MSYS2's UCRT64 packages, then started outside
# MSYS2 (with only Windows' own DLLs on the PATH) to check that nothing it
# needs is missing, and made to play a video with styled subtitles; and the
# setup, with Velopack's update packages, installed and then updated. Called
# by CI and Release.
name: Windows package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and start
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install MSYS2 and the build dependencies
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-webp-pixbuf-loader
      - name: Restore the build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/release
          key: windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-
      - name: Build
        run: cargo build --release --locked
      - name: Make the folder and its zip
        run: tools/windows-bundle.sh
      - name: Make the setup and its update packages
        shell: pwsh
        run: |
          dotnet tool install vpk --version 1.3.39-g8d2844f --tool-path target\vpk
          $vpk = "$PWD\target\vpk\vpk.exe"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          $out = "target\windows\velopack"
          # A release's update can be a delta from the release before, which vpk
          # needs at hand (none before the first release with updates)
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            & $vpk download github --repoUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY" --outputDir $out
            if ($LASTEXITCODE) { Write-Host "No release before to make a delta from" }
          }
          & $vpk pack --packId io.github.joaotroxo.Jelly --packVersion $version --packTitle Jelly `
            --packAuthors "Jelly contributors" --icon data\windows\jelly.ico --packDir target\windows\setup `
            --mainExe jelly.exe --outputDir $out --noPortable
          if ($LASTEXITCODE) { throw "vpk pack failed" }
          # What the release gets: the zip, the setup, and this version's
          # update packages and feed (an earlier one's stay on its release)
          $publish = New-Item -ItemType Directory target\windows\publish
          Copy-Item target\windows\jelly-$version-windows-x86_64.zip $publish
          Copy-Item (Get-ChildItem $out -Filter *-Setup.exe).FullName "$publish\jelly-windows-setup.exe"
          Get-ChildItem $out -File | Where-Object { $_.Name -like "*-$version-*.nupkg" -or $_.Name -in "releases.win.json", "assets.win.json", "RELEASES" } |
            Copy-Item -Destination $publish
          Get-ChildItem $out, $publish
      - name: Prepare a copy that plays video
        run: |
          smoke=target/windows-smoke
          mkdir -p $smoke
          cp -r target/windows/Jelly $smoke/app
          # The runner has no GPU: Mesa's software OpenGL (llvmpipe) in place
          # of Windows' OpenGL 1.1, next to the app in this copy only. Not
          # installed before the zip is made, or the zip would take it too
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-mesa
          bin=$smoke/app/runtime/bin
          for f in opengl32.dll libgallium_wgl.dll; do cp "$MINGW_PREFIX/bin/$f" $bin; ntldd -R "$MINGW_PREFIX/bin/$f"; done \
            | tr '\\' / | grep -io "[^ ]*/${MINGW_PREFIX#/}/bin/[^ ]*\.dll" | sort -fu \
            | while read -r dll; do cp -n "$(cygpath -u "$dll")" $bin; done
          printf '%s\n' '[Script Info]' 'ScriptType: v4.00+' '' '[V4+ Styles]' \
            'Format: Name, Fontname, Fontsize, PrimaryColour, Bold, Alignment, MarginV' \
            'Style: Default,Arial,48,&H00FFFFFF,1,2,40' '' '[Events]' \
            'Format: Layer, Start, End, Style, Text' \
            'Dialogue: 0,0:00:00.00,0:01:00.00,Default,A styled subtitle' > $smoke/subs.ass
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=24:duration=60 \
            -f lavfi -i sine=duration=60 -i $smoke/subs.ass -map 0 -map 1 -map 2 \
            -c:v libx264 -preset ultrafast -c:a aac -c:s ass -disposition:s:0 default $smoke/video.mkv
      - name: Start it outside MSYS2
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $smoke = "$PWD\target\windows-smoke"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:GALLIUM_DRIVER = "llvmpipe"
          $env:JELLY_MPV_LOG = "all=info"
          # Start `exe` with `arguments`, and after 20 s take a screenshot and
          # check it's still running
          function Run($name, $exe, [string[]]$arguments) {
            $start = @{ FilePath = $exe; WorkingDirectory = $env:USERPROFILE; PassThru = $true
                        RedirectStandardOutput = "$smoke\$name.out.txt"; RedirectStandardError = "$smoke\$name.err.txt" }
            if ($arguments) { $start.ArgumentList = $arguments }
            $app = Start-Process @start
            Start-Sleep 20
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $image = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            [System.Drawing.Graphics]::FromImage($image).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $image.Save("$smoke\$name.png")
            Get-Content "$smoke\$name.err.txt"
            if ($app.HasExited) { throw "${name}: jelly.exe exited with $($app.ExitCode)" }
            Stop-Process $app
          }
          Run sign-in "$PWD\target\windows\Jelly\jelly.exe"
          Run play "$smoke\app\jelly.exe" "--play", "$smoke\video.mkv"
          if (-not (Select-String -Quiet -Path "$smoke\play.out.txt" -Pattern "^VO: \[libmpv\]")) {
            Get-Content "$smoke\play.out.txt"
            throw "play: mpv never showed the video"
          }
          $version = (& target\windows\Jelly\jelly.exe --version | Out-String).Trim()
          $expected = "jelly " + (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          if ($version -ne $expected) { throw "jelly.exe --version said '$version', not '$expected'" }
      - name: Install the setup, and update it
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          $smoke = "$PWD\target\windows-smoke"
          # The next version (the same files), in a folder standing in for GitHub
          $v = [version]$version
          $next = "$($v.Major).$($v.Minor).$($v.Build + 1)"
          $feed = "$PWD\target\windows\update-feed"
          Copy-Item -Recurse target\windows\velopack $feed
          & "$PWD\target\vpk\vpk.exe" pack --packId io.github.joaotroxo.Jelly --packVersion $next --packTitle Jelly `
            --packAuthors "Jelly contributors" --icon data\windows\jelly.ico --packDir target\windows\setup `
            --mainExe jelly.exe --outputDir $feed --noPortable
          if ($LASTEXITCODE) { throw "vpk pack $next failed" }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          # The setup starts Jelly once it's installed: with --version, which only prints
          Start-Process target\windows\publish\jelly-windows-setup.exe -Wait `
            -ArgumentList "--silent", "--log", "$smoke\setup.log", "--", "--version"
          $root = "$env:LOCALAPPDATA\io.github.joaotroxo.Jelly"
          $installed = (& "$root\current\jelly.exe" --version | Out-String).Trim()
          if ($installed -ne "jelly $version") { throw "the installed jelly.exe said '$installed', not 'jelly $version'" }
          # Jelly downloads the next version in the background...
          $env:JELLY_UPDATE_FEED = $feed
          $app = Start-Process "$root\current\jelly.exe" -PassThru `
            -RedirectStandardOutput "$smoke\update.out.txt" -RedirectStandardError "$smoke\update.err.txt"
          $downloaded = { Get-ChildItem "$root\packages" -Filter "*$next-full.nupkg" -ErrorAction SilentlyContinue }
          for ($i = 0; $i -lt 90 -and -not (& $downloaded); $i++) { Start-Sleep 1 }
          Stop-Process $app -ErrorAction SilentlyContinue
          if (-not (& $downloaded)) { Get-Content "$smoke\update.err.txt"; throw "Jelly didn't download $next" }
          # ...and the next time it starts, it's that version
          Start-Process "$root\current\jelly.exe"
          $updated = { Select-String -Quiet -SimpleMatch $next -Path "$root\current\sq.version" -ErrorAction SilentlyContinue }
          for ($i = 0; $i -lt 90 -and -not (& $updated); $i++) { Start-Sleep 1 }
          Get-Process jelly -ErrorAction SilentlyContinue | Stop-Process
          if (-not (& $updated)) { throw "Jelly didn't update to $next" }
      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package
          path: target/windows/publish/*
          if-no-files-found: error
          retention-days: 7
          # Zips and nupkgs already
          compression-level: 0
      - name: Upload what the start looked like
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke
          path: |
            target/windows-smoke/*.png
            target/windows-smoke/*.txt
            target/windows-smoke/*.log
          retention-days: 7
