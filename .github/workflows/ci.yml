name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  linux:
    name: Linux package
    needs: checks
    uses: ./.github/workflows/linux-package.yml

  windows:
    name: Windows package
    needs: checks
    uses: ./.github/workflows/windows-package.yml
