[package]
name = "jelly"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native GTK and libadwaita Jellyfin client that plays everything directly with mpv"
license = "GPL-3.0-or-later"
repository = "https://github.com/JoaoTRoxo/jelly"
readme = "README.md"
keywords = ["jellyfin", "gtk", "libadwaita", "mpv", "media-player"]
categories = ["multimedia::video"]
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
async-channel = "2"
# Same gio as gtk's, with GLib 2.80's command-line calls
gio = { version = "0.21", features = ["v2_80"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4", features = ["json"] }

[features]
# Development: render the window to a PNG (tools/screenshot.sh)
screenshot = []

[profile.release]
lto = "thin"
strip = true
